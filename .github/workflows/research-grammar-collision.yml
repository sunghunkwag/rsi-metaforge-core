name: Research grammar-collision witness (synthetic only)

on:
  push:
    branches:
      - research/grammar-collision-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install numpy
      - name: Compile isolated research code
        run: python -m py_compile rsi3/grammar_collision_pilot.py rsi3/tests/test_grammar_collision.py
      - name: Run real-AST collision tests and existing receipt regressions
        run: python -m unittest rsi3.tests.test_grammar_collision rsi3.tests.test_exact_rejection rsi3.tests.test_components rsi3.tests.test_verifier_memory
      - name: Run preregistered synthetic three-arm study
        run: python -m rsi3.grammar_collision_pilot --output /tmp/grammar-collision.json
      - name: Upload synthetic raw data
        uses: actions/upload-artifact@v4
        with:
          name: grammar-collision-synthetic
          path: /tmp/grammar-collision.json
          retention-days: 14
