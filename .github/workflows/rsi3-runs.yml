name: RSI-3 runs

# Long RSI-3 runs on GitHub-hosted runners, one job per (arm, seed).
# Triggered only by pushes to branches named rsi3/run-<name>; the run plan is
# rsi3/runs/<name>.json on that branch:
#   {"config": "...", "arms": [...], "seeds": [...], "generations": 16,
#    "skip_validation": true, "evaluate": ["near"]}
# "evaluate" lists rsi3.reserve_eval partitions run once on each final
# checkpoint (seed list from the same config). An optional "configs" map
# (arm -> config path) overrides "config" per arm, so one plan can run arms
# registered under different configs. Nothing here reads TEST.
on:
  push:
    branches:
      - 'rsi3/run-*'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          name="${GITHUB_REF_NAME#rsi3/run-}"
          python3 - "$name" <<'PY'
          import json, os, sys
          name = sys.argv[1]
          plan = json.load(open(f"rsi3/runs/{name}.json"))
          configs = plan.get("configs", {})
          matrix = {"include": [{"arm": a, "seed": s, "config": configs.get(a, plan.get("config"))}
                                for a in plan["arms"] for s in plan["seeds"]]}
          assert all(item["config"] for item in matrix["include"]), "every arm needs a config"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"name={name}\n")
          print(json.dumps(plan, indent=1))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      ARM: ${{ matrix.arm }}
      SEED: ${{ matrix.seed }}
      CONFIG: ${{ matrix.config }}
      NAME: ${{ needs.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Unit tests
        run: python -m unittest rsi3.tests.test_sealing rsi3.tests.test_analogy rsi3.tests.test_chain rsi3.tests.test_fresh rsi3.tests.test_acceleration
      - name: Train
        run: |
          python3 - <<'PY' > args.txt
          import json, os
          plan = json.load(open(f"rsi3/runs/{os.environ['NAME']}.json"))
          extra = ["--generations", str(plan.get("generations", 16)), "--seeds", os.environ["SEED"]]
          if plan.get("skip_validation", True):
              extra.append("--skip-validation")
          print(" ".join(extra))
          PY
          extra=$(sed -n 1p args.txt)
          python -m rsi3.longrun --config "$CONFIG" --arm "$ARM" --output "out" $extra
      - name: Evaluate the final checkpoint
        run: |
          python3 - <<'PY' > parts.txt
          import json, os
          plan = json.load(open(f"rsi3/runs/{os.environ['NAME']}.json"))
          print(" ".join(plan.get("evaluate", [])))
          PY
          python3 -c "import json,sys; c=json.load(open('$CONFIG')); c['seeds']=[int('$SEED')]; json.dump(c, open('eval_config.json','w'))"
          for part in $(cat parts.txt); do
            python -m rsi3.reserve_eval --checkpoint "out/$ARM.checkpoint.pkl" --config eval_config.json \
              --partition "$part" --output "out/${ARM}_seed${SEED}_${part}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.plan.outputs.name }}-${{ matrix.arm }}-seed${{ matrix.seed }}
          path: out
          if-no-files-found: warn
