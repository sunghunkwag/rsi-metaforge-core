name: Temporary OEIS Evidence Budget

on:
  push:
    branches:
      - chatgpt-evidence-budget-20260820
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage exact prepared scripts and frozen sample IDs
        run: |
          sudo mkdir -p /mnt/data/evidence_curve
          sudo chown -R "$USER":"$USER" /mnt/data/evidence_curve
          cp tmp/evidence-budget/aids_400.txt /mnt/data/evidence_curve/aids_400.txt
          cp tmp/evidence-budget/fetch_oeis_bfiles.py /mnt/data/evidence_curve/fetch_oeis_bfiles.py
          cp tmp/evidence-budget/evidence_curve.py /mnt/data/evidence_curve/evidence_curve.py
          cat tmp/evidence-budget/run_bfile_curve.part_a tmp/evidence-budget/run_bfile_curve.part_b > /mnt/data/evidence_curve/run_bfile_curve.py

      - name: Verify prepared-script hashes
        run: |
          echo "d3311cb1f3cd47b6de0743dec722490d4c1b57d42fc63b0eb40907b4b54feb0f  /mnt/data/evidence_curve/aids_400.txt" | sha256sum -c -
          echo "b8010319698d67889d131a57af28983642dfba57643f10551975d96e5a1882ac  /mnt/data/evidence_curve/fetch_oeis_bfiles.py" | sha256sum -c -
          echo "5b86999e9fe553372af82b8e27e7664018e478429d75fab852b60e4cd5109f98  /mnt/data/evidence_curve/run_bfile_curve.py" | sha256sum -c -
          echo "4ce4946846bf2a308ee1de0daf22bf5a392e00e8e0b885cc937ddace93818fec  /mnt/data/evidence_curve/evidence_curve.py" | sha256sum -c -

      - name: Reconstruct exact frozen stripped projection from OEIS
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://oeis.org/stripped.gz -o /tmp/stripped.gz
          python - <<'PY'
          import gzip
          from pathlib import Path
          root = Path('/mnt/data/evidence_curve')
          aids = set(root.joinpath('aids_400.txt').read_text(encoding='utf-8').splitlines())
          selected = []
          with gzip.open('/tmp/stripped.gz', 'rt', encoding='utf-8', newline='') as handle:
              for line in handle:
                  if len(line) >= 8 and line[:7] in aids and line[7] == ' ':
                      selected.append(line)
          if len(selected) != 400 or len({line[:7] for line in selected}) != 400:
              raise SystemExit(f'Expected 400 exact stripped rows, got {len(selected)}')
          root.joinpath('stripped').write_text(''.join(selected), encoding='utf-8', newline='')
          PY
          echo "11f2213bf98c1bee51268f9dd327bbdea413d9446daf6507a0a370b921f3a6ad  /mnt/data/evidence_curve/stripped" | sha256sum -c -

      - name: Fetch official OEIS b-files
        run: |
          cd /mnt/data/evidence_curve
          python fetch_oeis_bfiles.py | tee fetch_stdout.txt

      - name: Run unchanged b-file evidence curve
        run: |
          cd /mnt/data/evidence_curve
          python run_bfile_curve.py | tee curve_stdout.txt

      - name: Build registered-reading summary
        run: |
          cd /mnt/data/evidence_curve
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          fetch = json.loads(root.joinpath('bfile_http_fetch_log.json').read_text())
          curve = json.loads(root.joinpath('bfile_curve_result.json').read_text())
          windows = (12, 24, 48, 96)
          statuses = {
              'fetched': sum(r['status'] in ('fetched', 'cached') for r in fetch),
              'absent_404': sum(r['status'] == 'absent_404' for r in fetch),
              'errors': sum(r['status'] not in ('fetched', 'cached', 'absent_404') for r in fetch),
          }
          thresholds = {str(t): sum(int(r['term_count']) >= t for r in fetch) for t in (40, 64, 112, 208)}
          common_size = curve['common_eligible_subset']['size']
          underpowered = common_size < 50
          rows = []
          for W in windows:
              row = curve['windows'][str(W)]
              passes = row['common_subset_pass_count']
              rows.append({
                  'window': W,
                  'common_pass_count': passes,
                  'max_recovered_order': row['max_recovered_order_common_subset'],
                  'cpu_seconds': row['cpu_seconds'],
                  'fraction_of_27_ceiling': passes / 27.0,
                  'fraction_label': f'{passes}/27',
              })
          predictions = {12: 13, 24: 21, 48: 25, 96: 25}
          prediction_score = []
          for row in rows:
              W = row['window']
              obs = row['common_pass_count']
              pred = predictions[W]
              prediction_score.append({
                  'window': W,
                  'predicted': pred,
                  'observed': obs,
                  'miss': obs - pred,
                  'absolute_miss': abs(obs - pred),
                  'exact': obs == pred,
              })
          orders = [row['max_recovered_order'] for row in rows]
          order_saturation_at_48 = (orders[2] is not None and orders[2] == orders[3])
          summary = {
              'fetch_summary': statuses,
              'term_count_distribution': thresholds,
              'common_eligible_subset_size': common_size,
              'underpowered': underpowered,
              'registered_reading': 'UNDERPOWERED' if underpowered else 'ADEQUATELY_POWERED',
              'window_curve': rows,
              'newly_solved': curve['newly_solved_on_common_subset'],
              'prediction_score': prediction_score,
              'frozen_predicted_saturation_window': 48,
              'max_order_saturation_at_48_observed': order_saturation_at_48,
              'saturation_verdict': 'NOT_PROMOTED_UNDERPOWERED' if underpowered else ('SUPPORTED' if order_saturation_at_48 else 'MISSED'),
              'void_prior_measurement': 'The stripped-only 14/5/0/0 numbers are void as an evidence-budget measurement because eligible coverage collapsed with window size.',
          }
          root.joinpath('FINAL_SUMMARY.json').write_text(json.dumps(summary, indent=2) + '\n')
          lines = ['# Final B-file Evidence-Budget Summary', '']
          lines.append(f"Common eligible subset size: **{common_size}**")
          if underpowered:
              lines += ['', '**UNDERPOWERED**: the common eligible subset is below 50; no saturation verdict is promoted.']
          lines += ['', '## Fetch summary', '', f"- fetched/cached: {statuses['fetched']}", f"- absent_404: {statuses['absent_404']}", f"- errors: {statuses['errors']}", '', 'Term-count thresholds:']
          for t in (40,64,112,208):
              lines.append(f"- >= {t}: {thresholds[str(t)]}")
          lines += ['', '## Direct evidence-budget curve', '', '| W | Common passes | Max recovered order | CPU seconds | Fraction of 27 ceiling |', '|---:|---:|---:|---:|---:|']
          for row in rows:
              lines.append(f"| {row['window']} | {row['common_pass_count']} | {row['max_recovered_order']} | {row['cpu_seconds']:.6f} | {row['fraction_label']} |")
          lines += ['', '## Newly solved sequences', '']
          if summary['newly_solved']:
              lines += ['| Slot | A-number | First W | Order | Coefficients |', '|---:|---|---:|---:|---|']
              for r in summary['newly_solved']:
                  lines.append(f"| {r['slot']} | {r['aid']} | {r['first_passing_window']} | {r['order']} | `{tuple(r['coefficients'])}` |")
          else:
              lines.append('None.')
          lines += ['', '## Frozen prediction score', '', '| W | Predicted | Observed | Miss | Absolute miss | Exact |', '|---:|---:|---:|---:|---:|---|']
          for r in prediction_score:
              lines.append(f"| {r['window']} | {r['predicted']} | {r['observed']} | {r['miss']} | {r['absolute_miss']} | {r['exact']} |")
          lines += ['', f"Frozen saturation prediction: W=48.", f"Max-order saturation at W=48 observed: {order_saturation_at_48}.", f"Saturation verdict: **{summary['saturation_verdict']}**.", '', summary['void_prior_measurement']]
          root.joinpath('FINAL_SUMMARY.md').write_text('\n'.join(lines) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-budget-bfile-results
          if-no-files-found: warn
          path: |
            /mnt/data/evidence_curve/bfile_http_fetch_log.json
            /mnt/data/evidence_curve/bfile_http_fetch_log.csv
            /mnt/data/evidence_curve/bfile_fetch_manifest.json
            /mnt/data/evidence_curve/bfile_term_counts.csv
            /mnt/data/evidence_curve/bfile_curve_result.json
            /mnt/data/evidence_curve/EVIDENCE_BUDGET_BFILE_RESULT.md
            /mnt/data/evidence_curve/fetch_stdout.txt
            /mnt/data/evidence_curve/curve_stdout.txt
            /mnt/data/evidence_curve/FINAL_SUMMARY.json
            /mnt/data/evidence_curve/FINAL_SUMMARY.md
