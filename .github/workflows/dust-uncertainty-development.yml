name: DUST uncertainty-guided routing development
on:
  push:
    branches:
      - research/dust-uncertainty-router-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile and all RSI-3 unit tests
        run: |
          python -m compileall -q rsi3
          python -m unittest discover -s rsi3/tests -t . -v
      - name: Matched TRAIN-only four-generation routing comparison
        run: |
          python -m rsi3.longrun --config rsi3/experiment_config_dust_uncertainty.json --arm RSI3_META_HONEST_DUST --output uncertainty-control --seeds 11 --generations 4 --skip-validation
          python -m rsi3.longrun --config rsi3/experiment_config_dust_uncertainty.json --arm RSI3_META_HONEST_DUST_UNCERTAINTY --output uncertainty-treatment --seeds 11 --generations 4 --skip-validation
          python - <<'PY'
          import json
          from pathlib import Path
          for arm, location in [("RSI3_META_HONEST_DUST", "uncertainty-control"),
                                ("RSI3_META_HONEST_DUST_UNCERTAINTY", "uncertainty-treatment")]:
              r = json.loads((Path(location) / f"{arm}_seed11.json").read_text())
              print("UNCERTAINTY_RESULT", arm,
                    "TRAIN", [g["train_solved"] for g in r["generations"]],
                    "CPU", r["cpu_seconds"],
                    "BUDGET", [g["wake"]["spent"] for g in r["generations"]],
                    "VALIDATION_UNOPENED", all(g["validation"] is None for g in r["generations"]),
                    flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncertainty-development
          path: |
            uncertainty-control/*_seed11.json
            uncertainty-treatment/*_seed11.json
          if-no-files-found: warn
