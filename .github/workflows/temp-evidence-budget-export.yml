name: Temporary OEIS Evidence Budget Export

on:
  push:
    branches:
      - chatgpt-evidence-budget-20260820
    paths-ignore:
      - 'tmp/evidence-budget/results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage exact prepared scripts
        run: |
          sudo mkdir -p /mnt/data/evidence_curve
          sudo chown -R "$USER":"$USER" /mnt/data/evidence_curve
          cp tmp/evidence-budget/aids_400.txt /mnt/data/evidence_curve/aids_400.txt
          cp tmp/evidence-budget/fetch_oeis_bfiles.py /mnt/data/evidence_curve/fetch_oeis_bfiles.py
          cp tmp/evidence-budget/evidence_curve.py /mnt/data/evidence_curve/evidence_curve.py
          cat tmp/evidence-budget/run_bfile_curve.part_a tmp/evidence-budget/run_bfile_curve.part_b > /mnt/data/evidence_curve/run_bfile_curve.py
          echo "d3311cb1f3cd47b6de0743dec722490d4c1b57d42fc63b0eb40907b4b54feb0f  /mnt/data/evidence_curve/aids_400.txt" | sha256sum -c -
          echo "b8010319698d67889d131a57af28983642dfba57643f10551975d96e5a1882ac  /mnt/data/evidence_curve/fetch_oeis_bfiles.py" | sha256sum -c -
          echo "5b86999e9fe553372af82b8e27e7664018e478429d75fab852b60e4cd5109f98  /mnt/data/evidence_curve/run_bfile_curve.py" | sha256sum -c -
          echo "4ce4946846bf2a308ee1de0daf22bf5a392e00e8e0b885cc937ddace93818fec  /mnt/data/evidence_curve/evidence_curve.py" | sha256sum -c -

      - name: Reconstruct frozen stripped projection and verify it
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://oeis.org/stripped.gz -o /tmp/stripped.gz
          python - <<'PY'
          import gzip
          from pathlib import Path
          root = Path('/mnt/data/evidence_curve')
          aids = set(root.joinpath('aids_400.txt').read_text(encoding='utf-8').splitlines())
          selected = []
          with gzip.open('/tmp/stripped.gz', 'rt', encoding='utf-8', newline='') as handle:
              for line in handle:
                  if len(line) >= 8 and line[:7] in aids and line[7] == ' ':
                      selected.append(line)
          if len(selected) != 400 or len({line[:7] for line in selected}) != 400:
              raise SystemExit(f'Expected 400 exact stripped rows, got {len(selected)}')
          root.joinpath('stripped').write_text(''.join(selected), encoding='utf-8', newline='')
          PY
          echo "11f2213bf98c1bee51268f9dd327bbdea413d9446daf6507a0a370b921f3a6ad  /mnt/data/evidence_curve/stripped" | sha256sum -c -

      - name: Fetch official OEIS b-files
        run: |
          cd /mnt/data/evidence_curve
          python fetch_oeis_bfiles.py | tee fetch_stdout.txt

      - name: Run unchanged curve script
        run: |
          cd /mnt/data/evidence_curve
          python run_bfile_curve.py | tee curve_stdout.txt

      - name: Commit temporary results to runner branch
        run: |
          mkdir -p tmp/evidence-budget/results
          cp /mnt/data/evidence_curve/bfile_http_fetch_log.json tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/bfile_http_fetch_log.csv tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/bfile_fetch_manifest.json tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/bfile_term_counts.csv tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/bfile_curve_result.json tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/EVIDENCE_BUDGET_BFILE_RESULT.md tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/fetch_stdout.txt tmp/evidence-budget/results/
          cp /mnt/data/evidence_curve/curve_stdout.txt tmp/evidence-budget/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/evidence-budget/results
          git commit -m "Temporary OEIS evidence-budget results"
          git push origin HEAD:chatgpt-evidence-budget-20260820
