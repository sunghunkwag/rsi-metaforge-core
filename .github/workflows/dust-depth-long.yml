name: Frozen depth-DUST long-run transfer check
on:
  push:
    branches:
      - research/dust-depth-long-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile source, check sealed test isolation
        run: |
          python -m compileall -q rsi3
          python -m unittest rsi3.tests.test_dust_metapolicy rsi3.tests.test_dust_depth rsi3.tests.test_sealing -v
      - name: Freeze 16-generation TRAIN-only DUST depth run
        run: |
          python -m rsi3.longrun --config rsi3/experiment_config_dust_depth.json --arm RSI3_META_HONEST_DUST_DEPTH --output dust-depth-long-frozen --generations 16 --seeds 11 --skip-validation
      - name: Evaluate previously published FAR2 once after TRAIN frozen
        run: |
          python -m rsi3.reserve_eval --checkpoint dust-depth-long-frozen/RSI3_META_HONEST_DUST_DEPTH.checkpoint.pkl --config rsi3/experiment_config_dust_depth.json --partition far2 --output dust-depth-far2-retrospective.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('dust-depth-long-frozen/RSI3_META_HONEST_DUST_DEPTH_seed11.json').read_text())
          b = json.loads(Path('dust-depth-far2-retrospective.json').read_text())
          print('FROZEN_DEPTH_TRANSFER', 'TRAIN', a['final']['train_solved'],
                'FAR2', {seed: x['solved'] for seed, x in b['seeds'].items()},
                'FAR2_TASKS', b['tasks'],
                'CPU', a['cpu_seconds'],
                'TRAIN_VALIDATION_UNOPENED',
                all(g['validation'] is None for g in a['generations']),
                flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-dust-depth-transfer
          path: |
            dust-depth-long-frozen/*_seed11.json
            dust-depth-far2-retrospective.json
          if-no-files-found: warn
